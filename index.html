<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Geometry Dash Lite</title>
<style>
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#111; font-family:Arial, sans-serif; }
  canvas { display:block; background: linear-gradient(#111, #1a1a2e 60%, #0f1020); }
  .hud {
    position:fixed; inset:0; pointer-events:none; color:#fff; text-shadow:0 2px 4px rgba(0,0,0,.6);
  }
  .topbar { display:flex; justify-content:space-between; padding:14px 16px; font-size:18px; }
  .center {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center;
    background:rgba(0,0,0,.35); padding:18px 22px; border:1px solid rgba(255,255,255,.12); border-radius:14px;
  }
  .center h1 { margin:0 0 8px; font-size:28px; }
  .center p { margin:6px 0; font-size:14px; line-height:1.5; opacity:.95; }
  .btn { display:inline-block; margin-top:10px; padding:10px 16px; border-radius:999px; background:#4cc9f0; color:#001018; font-weight:bold; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <div class="topbar"><div id="score">0%</div><div id="best">Best: 0%</div></div>
  <div class="center" id="overlay">
    <h1>Geometry Dash Lite</h1>
    <p>Press Space, Up, or Click to jump.</p>
    <p>Avoid the spikes and survive as long as you can.</p>
    <div class="btn">Start Game</div>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');

  function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
  addEventListener('resize', resize); resize();

  const groundY = () => canvas.height * 0.78;
  const gravity = 0.7;
  const jumpVel = -13;
  let started = false, gameOver = false, score = 0, best = 0, distance = 0;
  let speed = 6;
  const player = { x: 140, y: 0, w: 34, h: 34, vy: 0, rot: 0, onGround: true };
  const obstacles = [];
  let spawnTimer = 0;

  function reset(){
    started = false; gameOver = false; score = 0; distance = 0; speed = 6; spawnTimer = 0;
    obstacles.length = 0;
    player.y = groundY() - player.h;
    player.vy = 0; player.rot = 0; player.onGround = true;
    overlay.style.display = 'block';
    overlay.querySelector('h1').textContent = 'Geometry Dash Lite';
    overlay.querySelectorAll('p')[0].textContent = 'Press Space, Up, or Click to jump.';
    overlay.querySelectorAll('p')[1].textContent = 'Avoid the spikes and survive as long as you can.';
    overlay.querySelector('.btn').textContent = 'Start Game';
    scoreEl.textContent = '0%';
    bestEl.textContent = 'Best: ' + best + '%';
  }

  function start(){
    if (!started) {
      started = true;
      overlay.style.display = 'none';
    }
  }

  function jump(){
    if (gameOver) { reset(); return; }
    start();
    if (player.onGround) { player.vy = jumpVel; player.onGround = false; }
  }

  function addObstacle(){
    const type = Math.random() < 0.72 ? 'spike' : 'double';
    const baseH = 34;
    if (type === 'spike') {
      obstacles.push({ x: canvas.width + 40, y: groundY() - baseH, w: 34, h: baseH, type });
    } else {
      obstacles.push({ x: canvas.width + 30, y: groundY() - baseH, w: 34, h: baseH, type, gap: 54 });
      obstacles.push({ x: canvas.width + 74, y: groundY() - baseH, w: 34, h: baseH, type, gap: 54 });
    }
  }

  function collides(a, b){
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function drawGround(){
    const y = groundY();
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, y, canvas.width, canvas.height - y);
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(0, y - 6, canvas.width, 6);
    for (let i = 0; i < canvas.width; i += 40) {
      ctx.fillStyle = 'rgba(255,255,255,.08)';
      ctx.fillRect(i + (distance % 40), y + 10, 20, 3);
    }
  }

  function drawPlayer(){
    ctx.save();
    ctx.translate(player.x + player.w/2, player.y + player.h/2);
    ctx.rotate(player.rot);
    const grad = ctx.createLinearGradient(-18,-18,18,18);
    grad.addColorStop(0, '#4cc9f0');
    grad.addColorStop(1, '#4361ee');
    ctx.fillStyle = grad;
    ctx.fillRect(-player.w/2, -player.h/2, player.w, player.h);
    ctx.fillStyle = 'rgba(255,255,255,.2)';
    ctx.fillRect(-player.w/2+4, -player.h/2+4, player.w-8, 7);
    ctx.restore();
  }

  function drawObstacle(o){
    ctx.fillStyle = '#ff4d6d';
    ctx.beginPath();
    ctx.moveTo(o.x, o.y + o.h);
    ctx.lineTo(o.x + o.w/2, o.y);
    ctx.lineTo(o.x + o.w, o.y + o.h);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.15)';
    ctx.beginPath();
    ctx.moveTo(o.x + 5, o.y + o.h - 4);
    ctx.lineTo(o.x + o.w/2, o.y + 8);
    ctx.lineTo(o.x + o.w - 5, o.y + o.h - 4);
    ctx.closePath();
    ctx.fill();
  }

  function update(){
    if (!started || gameOver) return;

    distance += speed;
    score = Math.floor(distance / 12);
    speed = 6 + Math.min(6, score / 80);
    scoreEl.textContent = score + '%';
    bestEl.textContent = 'Best: ' + best + '%';

    player.vy += gravity;
    player.y += player.vy;
    player.rot += 0.08;
    const floor = groundY() - player.h;
    if (player.y >= floor) { player.y = floor; player.vy = 0; player.onGround = true; player.rot = 0; }

    spawnTimer--;
    if (spawnTimer <= 0) {
      addObstacle();
      spawnTimer = 70 + Math.random() * 50;
    }

    for (const o of obstacles) o.x -= speed;
    while (obstacles.length && obstacles[0].x + obstacles[0].w < -20) obstacles.shift();

    const hitbox = { x: player.x + 4, y: player.y + 4, w: player.w - 8, h: player.h - 8 };
    for (const o of obstacles) {
      const box = { x: o.x + 4, y: o.y + 2, w: o.w - 8, h: o.h - 2 };
      if (collides(hitbox, box)) {
        gameOver = true;
        best = Math.max(best, score);
        overlay.style.display = 'block';
        overlay.querySelector('h1').textContent = 'Game Over';
        overlay.querySelectorAll('p')[0].textContent = 'Score: ' + score + '%';
        overlay.querySelectorAll('p')[1].textContent = 'Press Space or Click to restart.';
        overlay.querySelector('.btn').textContent = 'Restart';
      }
    }
  }

  function render(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const bg = ctx.createLinearGradient(0,0,0,canvas.height);
    bg.addColorStop(0, '#10131f');
    bg.addColorStop(0.6, '#1b1f3a');
    bg.addColorStop(1, '#0b1020');
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    for (let i = 0; i < 12; i++) {
      ctx.fillStyle = 'rgba(255,255,255,.03)';
      ctx.fillRect((i*140 + (distance*0.3)%140) - 40, 80 + (i%3)*35, 70, 8);
    }

    drawGround();
    obstacles.forEach(drawObstacle);
    drawPlayer();

    if (!started && !gameOver) {
      ctx.fillStyle = 'rgba(255,255,255,.6)';
      ctx.font = '18px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Click or press Space to begin', canvas.width/2, canvas.height*0.18);
    }
  }

  function loop(){ update(); render(); requestAnimationFrame(loop); }

  addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
    if (e.code === 'KeyR' && gameOver) reset();
  });
  addEventListener('mousedown', jump);
  addEventListener('touchstart', e => { e.preventDefault(); jump(); }, { passive:false });
  overlay.addEventListener('click', jump);

  reset();
  loop();
})();
</script>
</body>
</html>
