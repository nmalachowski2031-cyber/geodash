<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geometry Dash Style Game</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0f1020;
      font-family: Arial, sans-serif;
    }
    #game {
      display: block;
      background: linear-gradient(#1b1d3a, #0f1020);
    }
    .hud {
      position: fixed;
      top: 10px;
      left: 10px;
      color: #fff;
      z-index: 10;
      user-select: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }
    .hud .row { margin-bottom: 6px; }
    .btn {
      padding: 8px 12px;
      background: #2b2f5e;
      color: white;
      border: 1px solid #6b73ff;
      border-radius: 8px;
      cursor: pointer;
    }
    .panel {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.45);
      z-index: 20;
    }
    .card {
      background: #151735;
      color: white;
      padding: 24px;
      border-radius: 16px;
      max-width: 460px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    }
    .card h1, .card h2 { margin-top: 0; }
    .hidden { display: none; }
    .small {
      font-size: 14px;
      opacity: 0.85;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="row">Level: <span id="levelName">Level 1</span></div>
    <div class="row">Score: <span id="score">0</span></div>
    <div class="row">Best: <span id="best">0</span></div>
    <div class="row small">Space / Click / Tap to jump</div>
  </div>

  <div id="startScreen" class="panel">
    <div class="card">
      <h1>Geometry Dash Style</h1>
      <p class="small">
        Random normal spikes appear in the level, while platforms spawn with smaller spikes under them.
      </p>
      <button id="startBtn" class="btn">Start Game</button>
    </div>
  </div>

  <div id="gameOverScreen" class="panel hidden">
    <div class="card">
      <h2>Game Over</h2>
      <p>Final Score: <span id="finalScore">0</span></p>
      <p class="small">Press R to restart, or click play again.</p>
      <button id="restartBtn" class="btn">Play Again</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const levelNameEl = document.getElementById('levelName');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScoreEl = document.getElementById('finalScore');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    let W = window.innerWidth, H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;

    window.addEventListener('resize', () => {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W;
      canvas.height = H;
      resetStars();
    });

    const groundY = () => Math.floor(H * 0.78);

    const player = {
      x: 120,
      y: 0,
      w: 34,
      h: 34,
      vy: 0,
      onGround: true,
      rotation: 0
    };

    const gravity = 0.85;
    const jumpVel = -15.5;
    const runSpeed = 4.2;

    let platforms = [];
    let smallSpikes = [];
    let normalSpikes = [];
    let particles = [];
    let stars = [];

    let running = false;
    let gameOver = false;
    let score = 0;
    let best = Number(localStorage.getItem('gd_best') || 0);
    let currentLevel = 0;

    const levels = [
      {
        name: 'Level 1',
        platforms: [
          { x: 430, w: 170, yOffset: 120, h: 14 },
          { x: 690, w: 160, yOffset: 170, h: 14 },
          { x: 940, w: 160, yOffset: 220, h: 14 }
        ]
      },
      {
        name: 'Level 2',
        platforms: [
          { x: 430, w: 140, yOffset: 110, h: 14 },
          { x: 650, w: 120, yOffset: 160, h: 14 },
          { x: 830, w: 130, yOffset: 210, h: 14 },
          { x: 1010, w: 150, yOffset: 260, h: 14 }
        ]
      },
      {
        name: 'Level 3',
        platforms: [
          { x: 430, w: 140, yOffset: 100, h: 14 },
          { x: 650, w: 130, yOffset: 150, h: 14 },
          { x: 830, w: 120, yOffset: 200, h: 14 },
          { x: 1000, w: 140, yOffset: 250, h: 14 },
          { x: 1180, w: 120, yOffset: 300, h: 14 }
        ]
      }
    ];

    bestEl.textContent = best;

    function resetStars() {
      stars = [];
      for (let i = 0; i < 80; i++) {
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: Math.random() * 2 + 0.4,
          s: Math.random() * 0.5 + 0.2
        });
      }
    }

    function addPlatformChunk(levelIndex, spawnX) {
      const level = levels[levelIndex % levels.length];
      levelNameEl.textContent = level.name;

      for (const p of level.platforms) {
        const px = spawnX + p.x;
        const py = groundY() - p.yOffset;
        platforms.push({ x: px, y: py, w: p.w, h: p.h });

        smallSpikes.push({
          x: px + 6,
          y: groundY() - 12,
          w: p.w - 12,
          h: 12
        });
      }
    }

    function spawnNormalSpike() {
      const size = 28;
      const x = W + 200;
      const y = groundY() - size;
      normalSpikes.push({ x, y, w: size, h: size });
    }

    function buildLevel(levelIndex) {
      currentLevel = levelIndex % levels.length;
      platforms = [];
      smallSpikes = [];
      normalSpikes = [];

      addPlatformChunk(currentLevel, W + 220);
      spawnNormalSpike();
    }

    function resetGame() {
      player.x = 120;
      player.y = groundY() - player.h;
      player.vy = 0;
      player.rotation = 0;
      player.onGround = true;
      particles = [];
      score = 0;
      gameOver = false;
      running = true;
      scoreEl.textContent = score;
      finalScoreEl.textContent = score;
      gameOverScreen.classList.add('hidden');
      startScreen.classList.add('hidden');
      resetStars();
      buildLevel(0);
    }

    function jump() {
      if (!running || gameOver) return;
      if (player.onGround) {
        player.vy = jumpVel;
        player.onGround = false;
        particles.push({
          x: player.x + player.w / 2,
          y: player.y + player.h,
          vx: (Math.random() - 0.5) * 4,
          vy: Math.random() * 3 + 1,
          life: 20
        });
      }
    }

    function rectsHit(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function drawBackground() {
      ctx.clearRect(0, 0, W, H);

      for (const s of stars) {
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
        s.x -= s.s;
        if (s.x < -5) {
          s.x = W + 5;
          s.y = Math.random() * H;
        }
      }

      const gy = groundY();
      ctx.fillStyle = '#11162d';
      ctx.fillRect(0, gy, W, H - gy);

      ctx.strokeStyle = '#5ef2ff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, gy);
      ctx.lineTo(W, gy);
      ctx.stroke();
    }

    function drawPlayer() {
      ctx.save();
      ctx.translate(player.x + player.w / 2, player.y + player.h / 2);
      ctx.rotate(player.rotation);
      ctx.fillStyle = '#6b73ff';
      ctx.fillRect(-player.w / 2, -player.h / 2, player.w, player.h);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.strokeRect(-player.w / 2, -player.h / 2, player.w, player.h);
      ctx.fillStyle = '#fff';
      ctx.fillRect(-6, -6, 5, 5);
      ctx.fillRect(1, -6, 5, 5);
      ctx.restore();
    }

    function drawPlatform(p) {
      ctx.fillStyle = '#3ee6a8';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.strokeStyle = '#c9ffe9';
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x, p.y, p.w, p.h);
    }

    function drawSmallSpike(s) {
      ctx.fillStyle = '#ff4d6d';
      const baseY = s.y + s.h;
      const count = Math.max(1, Math.floor(s.w / 14));
      const segment = s.w / count;
      for (let i = 0; i < count; i++) {
        const x0 = s.x + i * segment;
        ctx.beginPath();
        ctx.moveTo(x0, baseY);
        ctx.lineTo(x0 + segment / 2, s.y);
        ctx.lineTo(x0 + segment, baseY);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawNormalSpike(spike) {
      ctx.fillStyle = '#ff4d6d';
      ctx.beginPath();
      ctx.moveTo(spike.x, spike.y + spike.h);
      ctx.lineTo(spike.x + spike.w / 2, spike.y);
      ctx.lineTo(spike.x + spike.w, spike.y + spike.h);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#ffd6dd';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.fillStyle = 'rgba(94,242,255,' + Math.max(p.life / 20, 0) + ')';
        ctx.fillRect(p.x, p.y, 4, 4);
      }
    }

    function landOnPlatforms(prevY) {
      for (const p of platforms) {
        const horiz = player.x + player.w > p.x && player.x < p.x + p.w;
        const prevBottom = prevY + player.h;
        const curBottom = player.y + player.h;
        const topHit = player.vy >= 0 && prevBottom <= p.y && curBottom >= p.y;
        if (horiz && topHit) {
          player.y = p.y - player.h;
          player.vy = 0;
          player.onGround = true;
          player.rotation = Math.round(player.rotation / (Math.PI / 2)) * (Math.PI / 2);
          return true;
        }
      }
      return false;
    }

    function checkHit() {
      const hitbox = { x: player.x + 4, y: player.y + 4, w: player.w - 8, h: player.h - 8 };
      for (const s of smallSpikes) if (rectsHit(hitbox, s)) return true;
      for (const s of normalSpikes) if (rectsHit(hitbox, s)) return true;
      return false;
    }

    function update() {
      if (!running) return;

      score += 0.1;
      scoreEl.textContent = Math.floor(score);

      if (Math.floor(score) > best) {
        best = Math.floor(score);
        localStorage.setItem('gd_best', best);
        bestEl.textContent = best;
      }

      const prevY = player.y;
      player.x += runSpeed;

      if (player.x > W * 0.32) {
        const shift = player.x - W * 0.32;
        player.x = W * 0.32;
        for (const p of platforms) p.x -= shift;
        for (const s of smallSpikes) s.x -= shift;
        for (const s of normalSpikes) s.x -= shift;
      }

      if (!player.onGround) {
        player.vy += gravity;
        player.y += player.vy;
        player.rotation += 0.12;
      }

      player.onGround = false;

      if (player.y + player.h >= groundY()) {
        player.y = groundY() - player.h;
        player.vy = 0;
        player.onGround = true;
        player.rotation = Math.round(player.rotation / (Math.PI / 2)) * (Math.PI / 2);
      } else {
        landOnPlatforms(prevY);
      }

      if (checkHit()) {
        endGame(false);
        return;
      }

      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.12;
        p.life--;
      });
      particles = particles.filter(p => p.life > 0);

      platforms = platforms.filter(p => p.x + p.w > -120);
      smallSpikes = smallSpikes.filter(s => s.x + s.w > -120);
      normalSpikes = normalSpikes.filter(s => s.x + s.w > -120);

      if (platforms.length < 3) {
        const nextLevelIndex = (currentLevel + 1) % levels.length;
        addPlatformChunk(nextLevelIndex, W + 220);
        currentLevel = nextLevelIndex;
      }

      if (normalSpikes.length < 2 && Math.random() < 0.03) {
        spawnNormalSpike();
      }
    }

    function render() {
      drawBackground();
      for (const p of platforms) drawPlatform(p);
      for (const s of smallSpikes) drawSmallSpike(s);
      for (const s of normalSpikes) drawNormalSpike(s);
      drawParticles();
      drawPlayer();
    }

    function loop() {
      update();
      render();
      if (running && !gameOver) requestAnimationFrame(loop);
    }

    function endGame(won) {
      gameOver = true;
      running = false;
      finalScoreEl.textContent = Math.floor(score);
      gameOverScreen.querySelector('h2').textContent = won ? 'You Win!' : 'Game Over';
      gameOverScreen.classList.remove('hidden');
    }

    function start() {
      resetGame();
      requestAnimationFrame(loop);
    }

    startBtn.addEventListener('click', start);
    restartBtn.addEventListener('click', start);

    window.addEventListener('keydown', e => {
      if (e.code === 'Space') {
        e.preventDefault();
        jump();
      }
      if (e.code === 'KeyR' && gameOver) start();
    });

    window.addEventListener('mousedown', jump);
    window.addEventListener('touchstart', e => {
      e.preventDefault();
      jump();
    }, { passive: false });

    player.y = groundY() - player.h;
    resetStars();
    render();
  </script>
</body>
</html>
